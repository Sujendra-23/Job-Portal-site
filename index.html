<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Portal — New Grad 2027</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px; background: #f7f7f8; color: #1a1a1a; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .meta { color: #666; font-size: 13px; margin-bottom: 16px; }
  .wrap { overflow-x: auto; background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; min-width: 900px; font-size: 14px; }
  th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; vertical-align: top; }
  th { background: #fafafa; font-weight: 600; position: sticky; top: 0; }
  tr:last-child td { border-bottom: none; }
  .desc { max-width: 520px; }
  .desc .full { display: none; }
  .desc.expanded .full { display: block; }
  .desc.expanded .preview { display: none; }
  .toggle { color: #0066cc; cursor: pointer; font-size: 13px; }
  a.apply { color: #0066cc; font-weight: 600; white-space: nowrap; }
  .resume-empty { color: #999; font-style: italic; }
  .badge { display: inline-block; font-size: 11px; background: #eef4ff; color: #2456a6; border-radius: 4px; padding: 2px 6px; margin-left: 6px; }
  #search { padding: 8px 12px; font-size: 14px; width: 320px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 6px; }
</style>
</head>
<body>
<h1>Job Portal — New Grad 2027</h1>
<div class="meta" id="meta">Loading…</div>
<input id="search" type="text" placeholder="Filter by company or title…">
<div class="wrap">
<table>
  <thead>
    <tr><th>Company</th><th>Job description</th><th>Application link</th><th>Resume</th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
</div>
<script>
const key = r => r.company + '||' + r.title;
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
async function load(){
  const [roles, resumes] = await Promise.all([
    fetch('roles.json').then(r=>r.json()),
    fetch('resumes.json').then(r=>r.json()).catch(()=>({}))
  ]);
  const tb = document.getElementById('rows');
  tb.innerHTML = '';
  roles.forEach(r=>{
    const tr = document.createElement('tr');
    tr.dataset.search = (r.company+' '+r.title).toLowerCase();
    const plain = (r.description||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
    const prev = plain.slice(0,280) + (plain.length>280?'…':'');
    const resumeUrl = resumes[key(r)];
    tr.innerHTML =
      '<td><strong>'+esc(r.company)+'</strong><br><span style="color:#555">'+esc(r.title)+'</span><br><span style="color:#888;font-size:12px">'+esc(r.location||'')+' · '+esc(r.posting_date||'')+'</span>'+(r.degree?'<span class="badge">'+esc(r.degree)+'</span>':'')+'</td>'+
      '<td class="desc"><span class="preview">'+esc(prev)+'</span><span class="full">'+(r.description||'')+'</span><br><span class="toggle">Read more</span></td>'+
      '<td><a class="apply" href="'+esc(r.application_link)+'" target="_blank" rel="noopener">Apply</a></td>'+
      '<td>'+(resumeUrl?'<a class="apply" href="'+esc(resumeUrl)+'" target="_blank" rel="noopener">Resume</a>':'<span class="resume-empty">Not yet generated</span>')+'</td>';
    const cell = tr.querySelector('.desc');
    const tg = tr.querySelector('.toggle');
    tg.onclick = ()=>{ cell.classList.toggle('expanded'); tg.textContent = cell.classList.contains('expanded')?'Show less':'Read more'; };
    if(plain.length<=280) tg.style.display='none';
    tb.appendChild(tr);
  });
  document.getElementById('meta').textContent = roles.length+' roles · Last updated October 7, 2026';
  document.getElementById('search').oninput = e=>{
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('#rows tr').forEach(tr=>{
      tr.style.display = tr.dataset.search.includes(q)?'':'none';
    });
  };
}
load();
</script>
</body>
</html>
