<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Portal — New Grad 2027</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px; background: #f7f7f8; color: #1a1a1a; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .meta { color: #666; font-size: 13px; margin-bottom: 16px; }
  #search { padding: 8px 12px; font-size: 14px; width: 320px; margin-bottom: 16px; border: 1px solid #ddd; border-radius: 6px; }
  .tabs { margin-bottom: 16px; }
  .tab { display: inline-block; padding: 8px 18px; font-size: 14px; font-weight: 600; border: 1px solid #ddd; background: #fff; cursor: pointer; border-radius: 6px 6px 0 0; margin-right: 4px; color: #555; }
  .tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .day { margin-bottom: 28px; }
  .day-header { font-size: 18px; font-weight: 700; margin: 0 0 2px; }
  .day-sub { color: #666; font-size: 13px; margin-bottom: 8px; }
  .wrap { overflow-x: auto; background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; min-width: 900px; font-size: 14px; table-layout: fixed; }
  th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; vertical-align: top; }
  th { background: #fafafa; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .desc { max-width: 520px; }
  .desc .full { display: none; line-height: 1.55; }
  .desc.expanded .full { display: block; }
  .desc.expanded .preview { display: none; }
  .desc .full p { margin: 0 0 10px; }
  .desc .full h4 { margin: 14px 0 8px; font-size: 14px; }
  .desc .full ul, .desc .full ol { margin: 0 0 10px; padding-left: 20px; }
  .desc .full li { margin-bottom: 4px; }
  .toggle { color: #0066cc; cursor: pointer; font-size: 13px; }
  a.apply { color: #0066cc; font-weight: 600; white-space: nowrap; }
  a.email { color: #0066cc; }
  .resume-empty { color: #999; font-style: italic; }
  .badge { display: inline-block; font-size: 11px; background: #eef4ff; color: #2456a6; border-radius: 4px; padding: 2px 6px; margin-left: 6px; }
  .type-badge { display: inline-block; font-size: 10px; font-weight: 700; border-radius: 4px; padding: 2px 6px; margin-left: 6px; }
  .type-ft { background: #e8f0fe; color: #1a56db; }
  .type-intern { background: #fef3c7; color: #92400e; }
  .today-tag { display: inline-block; font-size: 11px; background: #e6f4ea; color: #137333; border-radius: 4px; padding: 2px 8px; margin-left: 8px; font-weight: 600; }
  .applied-badge { font-size: 11px; color: #137333; background: #e6f4ea; border-radius: 4px; padding: 3px 6px; margin-top: 6px; display: inline-block; line-height: 1.4; }
  .applied-badge .undo { color: #666; cursor: pointer; text-decoration: underline; margin-left: 4px; }
  .empty-tab { color: #888; font-style: italic; padding: 24px; background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; }
</style>
</head>
<body>
<h1>Job Portal — New Grad 2027</h1>
<div class="meta" id="meta">Loading…</div>
<input id="search" type="text" placeholder="Filter by company or title…">
<div class="tabs" id="tabs"></div>
<div id="content"></div>
<script>
const TABS = [
  { id:'top',     label:'Top Companies',            file:'roles_top.json',            kind:'roles'  },
  { id:'mid',     label:'Mid-size & Established',   file:'roles_midsize.json',        kind:'roles'  },
  { id:'growth',  label:'Growth Stage',             file:'roles_growth.json',         kind:'roles'  },
  { id:'startup', label:'Startup Stage',            file:'roles_startup.json',        kind:'roles'  },
  { id:'liposts', label:'LinkedIn Hiring Posts',    file:'roles_linkedin_posts.json', kind:'roles'  },
  { id:'emails',  label:'Emails',                   file:'emails.json',               kind:'emails' },
];
const key = r => r.company + '||' + r.title;
const isIntern = r => /\bintern(ship)?\b|\bco-?op\b/i.test(r.title || '');
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function decodeHtml(s){
  const t = document.createElement('textarea');
  let prev = s || '', out = prev;
  for(let i=0;i<3;i++){ t.innerHTML = out; out = t.value; if(out===prev) break; prev = out; }
  return out;
}
function mdInline(s){ return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
function formatDesc(raw){
  const html = decodeHtml(raw || '');
  if (/<\/?(p|div|ul|ol|li|h[1-6]|br|table)[ >]/i.test(html)) return html;
  const lines = esc(html).split('\n');
  let out = '', inList = false, para = [];
  const flushPara = () => { if(para.length){ out += '<p>' + para.join('<br>') + '</p>'; para = []; } };
  const closeList = () => { if(inList){ out += '</ul>'; inList = false; } };
  for(const line of lines){
    const t = line.trim();
    if(!t){ flushPara(); closeList(); continue; }
    const h = t.match(/^(#{1,4})\s+(.*)/);
    if(h){ flushPara(); closeList(); out += '<h4>' + mdInline(h[2]) + '</h4>'; continue; }
    const li = t.match(/^([-*•]|\d+[.)])\s+(.*)/);
    if(li){ flushPara(); if(!inList){ out += '<ul>'; inList = true; } out += '<li>' + mdInline(li[2]) + '</li>'; continue; }
    closeList(); para.push(mdInline(t));
  }
  flushPara(); closeList();
  return out;
}
function fmtDate(iso){
  if(!iso) return 'Date not listed';
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
}

let DATA = {};      // tabId -> array
let RESUMES = {};
let activeTab = 'top';

function resumeCell(u, person, label, rk){
  const inner = u
    ? '<a class="apply resume-link" data-person="'+person+'" data-rkey="'+esc(rk)+'" href="'+esc(u)+'" target="_blank" rel="noopener">Resume</a>'
    : '<span class="resume-empty">Not yet generated</span>';
  return '<td><div class="resume-wrap">'+inner+'<div class="applied-badge" data-badge="'+person+'" data-rkey="'+esc(rk)+'" style="display:none">✓ '+label+' clicked on this application <span class="undo" data-person="'+person+'" data-rkey="'+esc(rk)+'">undo</span></div></div></td>';
}
function rowHtml(r){
  const rk = key(r);
  const descHtml = formatDesc(r.description||'');
  const plain = decodeHtml(r.description||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
  const prev = plain.slice(0,280) + (plain.length>280?'…':'');
  const hasLong = plain.length > 280;
  const resumeUrl = RESUMES[rk];
  const sUrl = typeof resumeUrl === 'string' ? resumeUrl : (resumeUrl||{}).sujendra;
  const hUrl = (typeof resumeUrl === 'object' && resumeUrl) ? resumeUrl.shruthi : null;
  const tb = isIntern(r) ? '<span class="type-badge type-intern">Intern</span>' : '<span class="type-badge type-ft">Full-time</span>';
  return '<tr data-search="'+esc((r.company+' '+r.title).toLowerCase())+'">'+
    '<td><strong>'+esc(r.company)+'</strong><br><span style="color:#555">'+esc(r.title)+'</span>'+tb+'<br><span style="color:#888;font-size:12px">'+esc(r.location||'')+'</span>'+(r.degree?'<span class="badge">'+esc(r.degree)+'</span>':'')+'</td>'+
    '<td class="desc"><span class="preview">'+esc(prev)+'</span><span class="full">'+descHtml+'</span>'+(hasLong?'<br><span class="toggle">Read more</span>':'')+'</td>'+
    '<td><a class="apply" href="'+esc(r.application_link)+'" target="_blank" rel="noopener">Apply</a></td>'+
    resumeCell(sUrl,'sujendra','Sujendra',rk)+resumeCell(hUrl,'shruthi','Shruthi',rk)+
    '</tr>';
}
function renderRoles(roles){
  const groups = {};
  roles.forEach(r=>{ const d = r.posting_date || ''; (groups[d] = groups[d] || []).push(r); });
  const dates = Object.keys(groups).sort().reverse();
  const todayIso = new Date().toISOString().slice(0,10);
  let html = '';
  dates.forEach(d=>{
    const n = groups[d].length;
    html += '<div class="day"><div class="day-header">'+esc(fmtDate(d))+(d===todayIso?'<span class="today-tag">Today</span>':'')+'</div>'+
      '<div class="day-sub">'+n+' opening'+(n===1?'':'s')+'</div>'+
      '<div class="wrap"><table><colgroup><col style="width:18%"><col style="width:46%"><col style="width:12%"><col style="width:12%"><col style="width:12%"></colgroup>'+
      '<thead><tr><th>Company</th><th>Job description</th><th>Application link</th><th>Sujendra&rsquo;s Resume</th><th>Shruthi&rsquo;s Resume</th></tr></thead><tbody>'+
      groups[d].map(rowHtml).join('')+'</tbody></table></div></div>';
  });
  return { html: html || '<div class="empty-tab">No openings in this tab yet.</div>', count: roles.length, days: dates.length };
}
function renderEmails(contacts){
  const byCompany = {};
  contacts.forEach(c=>{ const k = c.company || 'Unknown'; (byCompany[k] = byCompany[k] || []).push(c); });
  const companies = Object.keys(byCompany).sort();
  let html = '';
  companies.forEach(co=>{
    html += '<div class="day"><div class="day-header">'+esc(co)+'</div>'+
      '<div class="day-sub">'+byCompany[co].length+' contact'+(byCompany[co].length===1?'':'s')+'</div>'+
      '<div class="wrap"><table><colgroup><col style="width:25%"><col style="width:35%"><col style="width:40%"></colgroup>'+
      '<thead><tr><th>Name</th><th>Title</th><th>Email</th></tr></thead><tbody>'+
      byCompany[co].map(c=>'<tr data-search="'+esc(((c.name||'')+' '+(c.company||'')).toLowerCase())+'"><td><strong>'+esc(c.name||'—')+'</strong></td><td>'+esc(c.title||'—')+'</td><td>'+(c.email?'<a class="email" href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a>':'<span class="resume-empty">—</span>')+'</td></tr>').join('')+
      '</tbody></table></div></div>';
  });
  return { html: html || '<div class="empty-tab">No contacts yet.</div>', count: contacts.length, days: companies.length };
}

function render(){
  const tab = TABS.find(t=>t.id===activeTab);
  const box = document.getElementById('content');
  let res;
  if(tab.kind === 'emails'){
    res = renderEmails(DATA[activeTab] || []);
    document.getElementById('meta').textContent = res.count+' contacts across '+res.days+' companies';
  } else {
    res = renderRoles(DATA[activeTab] || []);
    document.getElementById('meta').textContent = res.count+' roles across '+res.days+' days';
  }
  box.innerHTML = res.html;
  box.querySelectorAll('.desc .toggle').forEach(tg=>{
    tg.onclick = ()=>{
      const cell = tg.closest('.desc');
      cell.classList.toggle('expanded');
      tg.textContent = cell.classList.contains('expanded')?'Show less':'Read more';
    };
  });
  paintApplied();
  applyFilter();
}

async function load(){
  const tabsEl = document.getElementById('tabs');
  TABS.forEach(t=>{
    const s = document.createElement('span');
    s.className = 'tab' + (t.id===activeTab ? ' active' : '');
    s.id = 'tab-'+t.id;
    s.textContent = t.label;
    s.onclick = ()=>{ activeTab = t.id; setTab(); render(); };
    tabsEl.appendChild(s);
  });
  function setTab(){
    TABS.forEach(t=>document.getElementById('tab-'+t.id).classList.toggle('active', t.id===activeTab));
  }
  window.__setTab = setTab;

  const fetches = TABS.map(t=>fetch(t.file).then(r=>r.json()).catch(()=>[]));
  const [top, mid, growth, startup, liposts, emails, resumes] = await Promise.all([...fetches, fetch('resumes.json').then(r=>r.json()).catch(()=>({}))]);
  DATA = { top, mid, growth, startup, liposts, emails };
  RESUMES = resumes || {};

  document.getElementById('search').oninput = applyFilter;

  // ---- applied tracking (per-browser, via localStorage) ----
  const LS_KEY = 'jobportal_applied_v1';
  window.__getApplied = function(){ try { return JSON.parse(localStorage.getItem(LS_KEY)||'{}'); } catch(e){ return {}; } };
  window.__setApplied = function(m){ try { localStorage.setItem(LS_KEY, JSON.stringify(m)); } catch(e){} };
  document.getElementById('content').addEventListener('click', e=>{
    const link = e.target.closest('.resume-link');
    if(link){
      const rk = link.dataset.rkey, p = link.dataset.person;
      const m = window.__getApplied(); (m[rk] = m[rk]||{})[p] = new Date().toISOString();
      window.__setApplied(m); paintApplied();
      return;
    }
    const undo = e.target.closest('.undo');
    if(undo){
      e.preventDefault();
      const rk = undo.dataset.rkey, p = undo.dataset.person;
      const m = window.__getApplied(); if(m[rk]) delete m[rk][p];
      window.__setApplied(m); paintApplied();
    }
  });

  render();
}
function paintApplied(){
  const m = window.__getApplied ? window.__getApplied() : {};
  document.querySelectorAll('.applied-badge').forEach(b=>{
    const rk = b.dataset.rkey, p = b.dataset.badge;
    b.style.display = (m[rk] && m[rk][p]) ? 'inline-block' : 'none';
  });
}
function applyFilter(){
  const q = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('#content tr[data-search]').forEach(tr=>{
    tr.style.display = tr.dataset.search.includes(q)?'':'none';
  });
  document.querySelectorAll('#content .day').forEach(sec=>{
    const anyVisible = [...sec.querySelectorAll('tr[data-search]')].some(tr=>tr.style.display!=='none');
    sec.style.display = anyVisible?'':'none';
  });
}
load();
</script>
</body>
</html>
