<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Portal — New Grad 2027</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px; background: #f7f7f8; color: #1a1a1a; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .meta { color: #666; font-size: 13px; margin-bottom: 16px; }
  #search { padding: 8px 12px; font-size: 14px; width: 320px; margin-bottom: 16px; border: 1px solid #ddd; border-radius: 6px; }
  .day { margin-bottom: 28px; }
  .day-header { font-size: 18px; font-weight: 700; margin: 0 0 2px; }
  .day-sub { color: #666; font-size: 13px; margin-bottom: 8px; }
  .wrap { overflow-x: auto; background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; min-width: 900px; font-size: 14px; table-layout: fixed; }
  th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; vertical-align: top; }
  th { background: #fafafa; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .desc { max-width: 520px; }
  .desc .full { display: none; line-height: 1.55; }
  .desc.expanded .full { display: block; }
  .desc .full p { margin: 0 0 10px; }
  .desc .full h4 { margin: 14px 0 8px; font-size: 14px; }
  .desc .full ul, .desc .full ol { margin: 0 0 10px; padding-left: 20px; }
  .desc .full li { margin-bottom: 4px; }
  .desc.expanded .full { display: block; }
  .desc.expanded .preview { display: none; }
  .toggle { color: #0066cc; cursor: pointer; font-size: 13px; }
  a.apply { color: #0066cc; font-weight: 600; white-space: nowrap; }
  .resume-empty { color: #999; font-style: italic; }
  .badge { display: inline-block; font-size: 11px; background: #eef4ff; color: #2456a6; border-radius: 4px; padding: 2px 6px; margin-left: 6px; }
  .applied-badge { font-size: 11px; color: #137333; background: #e6f4ea; border-radius: 4px; padding: 3px 6px; margin-top: 6px; display: inline-block; line-height: 1.4; }
  .applied-badge .undo { color: #666; cursor: pointer; text-decoration: underline; margin-left: 4px; }
  .tabs { margin-bottom: 16px; }
  .tab { display: inline-block; padding: 8px 18px; font-size: 14px; font-weight: 600; border: 1px solid #ddd; background: #fff; cursor: pointer; border-radius: 6px 6px 0 0; margin-right: 4px; color: #555; }
  .tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
</style>
</head>
<body>
<h1>Job Portal — New Grad 2027</h1>
<div class="meta" id="meta">Loading…</div>
<input id="search" type="text" placeholder="Filter by company or title…">
<div class="tabs">
  <span class="tab active" id="tab-all">All openings</span><span class="tab" id="tab-top">Top companies</span>
</div>
<div id="days"></div>
<script>
const key = r => r.company + '||' + r.title;
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function decodeHtml(s){
  const t = document.createElement('textarea');
  let prev = s || '', out = prev;
  for(let i=0;i<3;i++){ t.innerHTML = out; out = t.value; if(out===prev) break; prev = out; }
  return out;
}
function mdInline(s){ return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
function formatDesc(raw){
  const html = decodeHtml(raw || '');
  if (/<\/?(p|div|ul|ol|li|h[1-6]|br|table)[ >]/i.test(html)) return html; // already HTML: render as-is
  // plain text -> structured HTML (paragraphs, headings, lists), like the career portal
  const lines = esc(html).split('\n');
  let out = '', inList = false, para = [];
  const flushPara = () => { if(para.length){ out += '<p>' + para.join('<br>') + '</p>'; para = []; } };
  const closeList = () => { if(inList){ out += '</ul>'; inList = false; } };
  for(const line of lines){
    const t = line.trim();
    if(!t){ flushPara(); closeList(); continue; }
    const h = t.match(/^(#{1,4})\s+(.*)/);
    if(h){ flushPara(); closeList(); out += '<h4>' + mdInline(h[2]) + '</h4>'; continue; }
    const li = t.match(/^([-*•]|\d+[.)])\s+(.*)/);
    if(li){ flushPara(); if(!inList){ out += '<ul>'; inList = true; } out += '<li>' + mdInline(li[2]) + '</li>'; continue; }
    closeList(); para.push(mdInline(t));
  }
  flushPara(); closeList();
  return out;
}
function fmtDate(iso){
  if(!iso) return 'Date not listed';
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
}
function rowHtml(r, resumes){
  const descHtml = formatDesc(r.description||'');
  const plain = decodeHtml(r.description||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
  const prev = plain.slice(0,280) + (plain.length>280?'…':'');
  const resumeUrl = resumes[key(r)];
  const rk = key(r);
  const sUrl = typeof resumeUrl === 'string' ? resumeUrl : (resumeUrl||{}).sujendra;
  const hUrl = (typeof resumeUrl === 'object' && resumeUrl) ? resumeUrl.shruthi : null;
  const resumeCell = (u, person, label) => {
    const inner = u
      ? '<a class="apply resume-link" data-person="'+person+'" data-rkey="'+esc(rk)+'" href="'+esc(u)+'" target="_blank" rel="noopener">Resume</a>'
      : '<span class="resume-empty">Not yet generated</span>';
    return '<td><div class="resume-wrap">'+inner+'<div class="applied-badge" data-badge="'+person+'" data-rkey="'+esc(rk)+'" style="display:none">✓ '+label+' clicked on this application <span class="undo" data-person="'+person+'" data-rkey="'+esc(rk)+'">undo</span></div></div></td>';
  };
  const hasLong = plain.length > 280;
  return '<tr data-search="'+esc((r.company+' '+r.title).toLowerCase())+'">'+
    '<td><strong>'+esc(r.company)+'</strong><br><span style="color:#555">'+esc(r.title)+'</span><br><span style="color:#888;font-size:12px">'+esc(r.location||'')+'</span>'+(r.degree?'<span class="badge">'+esc(r.degree)+'</span>':'')+'</td>'+
    '<td class="desc"><span class="preview">'+esc(prev)+'</span><span class="full">'+descHtml+'</span>'+(hasLong?'<br><span class="toggle">Read more</span>':'')+'</td>'+
    '<td><a class="apply" href="'+esc(r.application_link)+'" target="_blank" rel="noopener">Apply</a></td>'+
    resumeCell(sUrl,'sujendra','Sujendra')+resumeCell(hUrl,'shruthi','Shruthi')+
    '</tr>';
}
async function load(){
  const [roles, resumes, topCompanies] = await Promise.all([
    fetch('roles.json').then(r=>r.json()),
    fetch('resumes.json').then(r=>r.json()).catch(()=>({})),
    fetch('top_companies.json').then(r=>r.json()).catch(()=>[])
  ]);
  const topSet = new Set(topCompanies);
  let mode = 'all'; // 'all' | 'top'
  const visible = () => mode==='top' ? roles.filter(r=>topSet.has(r.company)) : roles;
  function render(){
    const list = visible();
    // group by posting date, newest first
    const groups = {};
    list.forEach(r=>{ const d = r.posting_date || ''; (groups[d] = groups[d] || []).push(r); });
    const dates = Object.keys(groups).sort().reverse();
    const todayIso = new Date().toISOString().slice(0,10);
    const box = document.getElementById('days');
    box.innerHTML = '';
    dates.forEach((d,i)=>{
    const sec = document.createElement('div');
    sec.className = 'day';
    const n = groups[d].length;
    sec.innerHTML = '<div class="day-header">'+esc(fmtDate(d))+(d===todayIso?'<span class="today-tag">Today</span>':'')+'</div>'+
      '<div class="day-sub">'+n+' opening'+(n===1?'':'s')+'</div>'+
      '<div class="wrap"><table><colgroup><col style="width:18%"><col style="width:46%"><col style="width:12%"><col style="width:12%"><col style="width:12%"></colgroup><thead><tr><th>Company</th><th>Job description</th><th>Application link</th><th>Sujendra&rsquo;s Resume</th><th>Shruthi&rsquo;s Resume</th></tr></thead><tbody>'+
      groups[d].map(r=>rowHtml(r,resumes)).join('')+'</tbody></table></div>';
    box.appendChild(sec);
  });
  box.querySelectorAll('.desc .toggle').forEach(tg=>{
    tg.onclick = ()=>{
      const cell = tg.closest('.desc');
      cell.classList.toggle('expanded');
      tg.textContent = cell.classList.contains('expanded')?'Show less':'Read more';
    };
  });
  document.getElementById('meta').textContent = roles.length+' roles across '+dates.length+' days · Last updated October 7, 2026';
  applyFilter();
  paintApplied();
  } // end render()
  document.getElementById('tab-all').onclick = ()=>{ mode='all'; setTab(); render(); };
  document.getElementById('tab-top').onclick = ()=>{ mode='top'; setTab(); render(); };
  function setTab(){
    document.getElementById('tab-all').classList.toggle('active', mode==='all');
    document.getElementById('tab-top').classList.toggle('active', mode==='top');
  }
  function applyFilter(){
    const q = document.getElementById('search').value.toLowerCase();
    document.querySelectorAll('#days tr[data-search]').forEach(tr=>{
      tr.style.display = tr.dataset.search.includes(q)?'':'none';
    });
    document.querySelectorAll('#days .day').forEach(sec=>{
      const anyVisible = [...sec.querySelectorAll('tr[data-search]')].some(tr=>tr.style.display!=='none');
      sec.style.display = anyVisible?'':'none';
    });
  }
  document.getElementById('search').oninput = applyFilter;
  // ---- applied tracking (per-browser, via localStorage) ----
  const LS_KEY = 'jobportal_applied_v1';
  function getApplied(){ try { return JSON.parse(localStorage.getItem(LS_KEY)||'{}'); } catch(e){ return {}; } }
  function setApplied(m){ try { localStorage.setItem(LS_KEY, JSON.stringify(m)); } catch(e){} }
  function paintApplied(){
    const m = getApplied();
    document.querySelectorAll('.applied-badge').forEach(b=>{
      const rk = b.dataset.rkey, p = b.dataset.badge;
      b.style.display = (m[rk] && m[rk][p]) ? 'inline-block' : 'none';
    });
  }
  document.getElementById('days').addEventListener('click', e=>{
    const link = e.target.closest('.resume-link');
    if(link){
      const rk = link.dataset.rkey, p = link.dataset.person;
      const m = getApplied(); (m[rk] = m[rk]||{})[p] = new Date().toISOString();
      setApplied(m); paintApplied();
      return; // let the resume open normally
    }
    const undo = e.target.closest('.undo');
    if(undo){
      e.preventDefault();
      const rk = undo.dataset.rkey, p = undo.dataset.person;
      const m = getApplied(); if(m[rk]) delete m[rk][p];
      setApplied(m); paintApplied();
    }
  });
  render();
}
load();
</script>
</body>
</html>
