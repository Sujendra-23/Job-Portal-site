name: Jobright collection and Pages
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: portal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Restore known legacy page integration
        run: python automation/ensure_portal_integration.py
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/portal.test.cjs
  sync-and-build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      published_sha: ${{ steps.snapshot.outputs.published_sha }}
      collection_time: ${{ steps.snapshot.outputs.collection_time }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Restore known legacy page integration
        id: portal_repair
        run: python automation/ensure_portal_integration.py
      - name: Collect public Jobright lists
        run: python automation/collect_public_jobright.py
      - name: Import permitted export
        if: github.event_name != 'push' && vars.JOBRIGHT_IMPORT_AUTHORIZED == 'true'
        env:
          JOBRIGHT_IMPORT_AUTHORIZED: ${{ vars.JOBRIGHT_IMPORT_AUTHORIZED }}
          JOBRIGHT_FEED_HOST: ${{ vars.JOBRIGHT_FEED_HOST }}
          JOBRIGHT_FEED_URL: ${{ secrets.JOBRIGHT_FEED_URL }}
          JOBRIGHT_FEED_TOKEN: ${{ secrets.JOBRIGHT_FEED_TOKEN }}
        run: python automation/sync_jobs.py
      - name: Safely publish collected data
        env:
          PORTAL_REPAIRED: ${{ steps.portal_repair.outputs.changed }}
        run: python automation/publish_collected_data.py
      - name: Record the publication snapshot
        id: snapshot
        run: |
          python - <<'PYTHON'
          import json, os, subprocess
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          status = json.load(open('jobright_public_sync.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('published_sha=' + sha + '\n')
              f.write('collection_time=' + status['last_success'] + '\n')
          PYTHON
      - run: python automation/build_pages.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: sync-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sync-and-build.outputs.published_sha }}
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify live Jobright data
        run: python3 automation/verify_live_site.py --expected-time "${{ needs.sync-and-build.outputs.collection_time }}"
